worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;
  client_max_body_size 32m;

  # eXist Apache HttpClient sends Expect: 100-continue; CollateX/Grizzly then
  # replies with Transfer-Encoding: chunked and no Content-Length, which hangs
  # the client (see GitHub issue #7). Buffer the upstream response so nginx
  # emits Content-Length on the way out.
  server {
    listen 17105;
    server_name _;

    location / {
      proxy_pass http://127.0.0.1:17106;
      proxy_http_version 1.1;

      proxy_connect_timeout 5s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;

      proxy_request_buffering on;
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 64 64k;
      proxy_busy_buffers_size 256k;

      # Prefer a clean end-of-response for picky clients.
      add_header Connection close always;
    }
  }
}
